<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動詞小達人 — 中文填詞挑戰</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #6C5CE7;
    --secondary: #00B894;
    --accent: #FDCB6E;
    --danger: #E17055;
    --info: #74B9FF;
    --pink: #FD79A8;
    --dark: #2D3436;
    --light: #F8F9FA;
    --card-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* ── Floating Bubbles Background ── */
  .bubbles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.15; }
    90% { opacity: 0.15; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ── Container ── */
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  /* ── Welcome Screen ── */
  #welcome-screen {
    text-align: center;
    padding: 60px 20px;
    animation: fadeInUp 0.8s ease;
  }
  #welcome-screen .mascot {
    font-size: 100px;
    animation: bounce 2s ease infinite;
    display: block;
    margin-bottom: 10px;
  }
  #welcome-screen h1 {
    font-size: 3em;
    font-weight: 900;
    color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    margin-bottom: 10px;
    letter-spacing: 4px;
  }
  #welcome-screen .subtitle {
    font-size: 1.3em;
    color: rgba(255,255,255,0.9);
    margin-bottom: 40px;
  }
  .start-btn {
    display: inline-block;
    padding: 18px 60px;
    font-size: 1.5em;
    font-weight: 700;
    color: var(--primary);
    background: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    transition: all 0.3s;
    font-family: inherit;
    letter-spacing: 2px;
  }
  .start-btn:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 12px 35px rgba(0,0,0,0.25);
  }

  /* ── Game Screen ── */
  #game-screen { display: none; animation: fadeInUp 0.6s ease; }

  /* Header Bar */
  .game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 16px;
  }
  .level-badge {
    background: var(--accent);
    color: var(--dark);
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 1em;
  }
  .score-display {
    color: #fff;
    font-weight: 700;
    font-size: 1.1em;
  }
  .score-display .star { color: var(--accent); }
  .progress-bar-wrap {
    flex: 1;
    margin: 0 15px;
    height: 10px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--danger));
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  /* Main Card */
  .game-card {
    background: #fff;
    border-radius: 24px;
    box-shadow: var(--card-shadow);
    overflow: hidden;
    margin-bottom: 20px;
  }

  /* Task Section */
  .task-section {
    background: linear-gradient(135deg, #2d3436, #636e72);
    color: #fff;
    padding: 20px 28px;
    position: relative;
  }
  .task-section .coach-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: var(--dark);
    padding: 5px 14px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.9em;
    margin-bottom: 10px;
  }
  .task-section .coach-badge .emoji { font-size: 1.2em; }
  .task-section .task-text {
    font-size: 1.15em;
    line-height: 1.7;
  }
  .task-section .keyword {
    display: inline-block;
    background: var(--accent);
    color: var(--dark);
    padding: 2px 10px;
    border-radius: 6px;
    font-weight: 700;
  }

  /* Verb Toolbox */
  .toolbox-section {
    padding: 22px 28px;
    border-bottom: 3px dashed #eee;
  }
  .toolbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 1.05em;
    color: var(--dark);
    margin-bottom: 14px;
  }
  .toolbox-label .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px; height: 30px;
    background: var(--primary);
    color: #fff;
    border-radius: 8px;
    font-size: 1em;
  }
  .verb-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .verb-btn {
    padding: 10px 22px;
    font-size: 1.15em;
    font-weight: 700;
    border: 3px solid transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
    letter-spacing: 2px;
    position: relative;
    user-select: none;
  }
  .verb-btn:hover:not(.used):not(.selected) {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .verb-btn.selected {
    transform: scale(1.1);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--dark);
    z-index: 2;
  }
  .verb-btn.used {
    opacity: 0.3;
    cursor: default;
    transform: scale(0.95);
  }

  /* Verb colors */
  .verb-color-0 { background: #FF6B6B; color: #fff; }
  .verb-color-1 { background: #4ECDC4; color: #fff; }
  .verb-color-2 { background: #45B7D1; color: #fff; }
  .verb-color-3 { background: #96CEB4; color: var(--dark); }
  .verb-color-4 { background: #FECA57; color: var(--dark); }
  .verb-color-5 { background: #FF9FF3; color: var(--dark); }
  .verb-color-6 { background: #54A0FF; color: #fff; }
  .verb-color-7 { background: #F97F51; color: #fff; }

  /* Passage Section */
  .passage-section {
    padding: 28px;
  }
  .passage-area {
    background: #f8f9fa;
    border-radius: 16px;
    padding: 24px;
    font-size: 1.25em;
    line-height: 2.2;
    color: var(--dark);
    border: 2px solid #eee;
    position: relative;
  }
  .passage-area .quote-mark {
    color: var(--primary);
    font-size: 1.4em;
    font-weight: 900;
  }
  .blank-slot {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 72px;
    height: 42px;
    border: 3px dashed var(--primary);
    border-radius: 10px;
    margin: 0 4px;
    padding: 0 10px;
    cursor: pointer;
    transition: all 0.3s;
    vertical-align: middle;
    position: relative;
    background: rgba(108, 92, 231, 0.06);
    font-weight: 700;
    font-size: 0.95em;
    letter-spacing: 2px;
  }
  .blank-slot:hover {
    border-color: var(--danger);
    background: rgba(225, 112, 85, 0.08);
  }
  .blank-slot.filled {
    border-style: solid;
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    animation: popIn 0.3s ease;
  }
  .blank-slot.correct {
    background: var(--secondary) !important;
    border-color: var(--secondary) !important;
    animation: correctPulse 0.6s ease;
  }
  .blank-slot.wrong {
    background: var(--danger) !important;
    border-color: var(--danger) !important;
    animation: shake 0.5s ease;
  }
  .blank-slot .blank-num {
    position: absolute;
    top: -10px;
    left: -10px;
    width: 22px; height: 22px;
    background: var(--accent);
    color: var(--dark);
    border-radius: 50%;
    font-size: 0.65em;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
  }
  .blank-slot.pulse {
    animation: pulseBlank 1.5s ease infinite;
  }

  /* Goal Section */
  .goal-section {
    padding: 14px 28px;
    background: linear-gradient(90deg, #dfe6e9, #b2bec3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .goal-section .goal-icon {
    font-size: 1.2em;
  }
  .goal-section .goal-text {
    font-size: 0.95em;
    color: var(--dark);
    font-weight: 500;
  }

  /* Action Buttons */
  .action-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .check-btn, .next-btn, .reset-btn, .hint-btn {
    padding: 14px 36px;
    font-size: 1.15em;
    font-weight: 700;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    letter-spacing: 1px;
  }
  .check-btn {
    background: linear-gradient(135deg, var(--primary), #a29bfe);
    color: #fff;
    box-shadow: 0 4px 15px rgba(108,92,231,0.4);
  }
  .check-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,0.5); }
  .check-btn:disabled { opacity: 0.5; cursor: default; transform: none; }
  .next-btn {
    background: linear-gradient(135deg, var(--secondary), #55efc4);
    color: #fff;
    box-shadow: 0 4px 15px rgba(0,184,148,0.4);
    display: none;
  }
  .next-btn:hover { transform: translateY(-2px); }
  .reset-btn {
    background: rgba(255,255,255,0.2);
    color: #fff;
    backdrop-filter: blur(5px);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .reset-btn:hover { background: rgba(255,255,255,0.3); }
  .hint-btn {
    background: linear-gradient(135deg, var(--accent), #f9ca24);
    color: var(--dark);
    box-shadow: 0 4px 15px rgba(253,203,110,0.4);
    padding: 14px 24px;
  }
  .hint-btn:hover { transform: translateY(-2px); }
  .hint-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  /* Result Screen */
  #result-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
    animation: fadeInUp 0.8s ease;
  }
  #result-screen .trophy { font-size: 100px; animation: bounce 2s ease infinite; display: block; margin-bottom: 10px; }
  #result-screen h2 {
    font-size: 2.5em;
    color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    margin-bottom: 10px;
  }
  #result-screen .final-score {
    font-size: 1.5em;
    color: var(--accent);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .stars-display { font-size: 3em; margin: 15px 0; }
  .stars-display .star-empty { opacity: 0.3; }
  #result-screen .result-detail {
    color: rgba(255,255,255,0.85);
    font-size: 1.1em;
    margin-bottom: 30px;
    line-height: 1.8;
  }

  /* Feedback Modal */
  .feedback-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .feedback-overlay.show { display: flex; }
  .feedback-card {
    background: #fff;
    border-radius: 24px;
    padding: 36px;
    max-width: 500px;
    width: 90%;
    text-align: center;
    animation: popIn 0.4s ease;
  }
  .feedback-card .fb-icon { font-size: 60px; margin-bottom: 10px; }
  .feedback-card h3 { font-size: 1.5em; margin-bottom: 8px; }
  .feedback-card p { color: #636e72; font-size: 1em; margin-bottom: 5px; line-height: 1.6; }
  .feedback-card .fb-detail {
    margin-top: 12px;
    padding: 14px;
    background: #f8f9fa;
    border-radius: 12px;
    text-align: left;
    font-size: 0.95em;
    line-height: 1.8;
  }
  .feedback-card .fb-detail .correct-mark { color: var(--secondary); font-weight: 700; }
  .feedback-card .fb-detail .wrong-mark { color: var(--danger); font-weight: 700; }
  .feedback-card .fb-btn {
    margin-top: 18px;
    padding: 12px 40px;
    font-size: 1.1em;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
  }
  .fb-btn-success { background: var(--secondary); color: #fff; }
  .fb-btn-retry { background: var(--danger); color: #fff; }
  .fb-btn-success:hover, .fb-btn-retry:hover { transform: translateY(-2px); }

  /* Hint popup */
  .hint-popup {
    display: none;
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--dark);
    padding: 14px 28px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 1.05em;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    z-index: 50;
    animation: fadeInUp 0.3s ease;
    max-width: 90%;
    text-align: center;
  }
  .hint-popup.show { display: block; }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    z-index: 200;
    pointer-events: none;
  }

  /* ── Animations ── */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    70% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @keyframes correctPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  @keyframes pulseBlank {
    0%, 100% { box-shadow: 0 0 0 0 rgba(108,92,231,0.3); }
    50% { box-shadow: 0 0 0 8px rgba(108,92,231,0); }
  }

  /* ── Responsive ── */
  @media (max-width: 600px) {
    #welcome-screen h1 { font-size: 2em; }
    #welcome-screen .mascot { font-size: 70px; }
    .task-section, .toolbox-section, .passage-section { padding: 16px 18px; }
    .passage-area { font-size: 1.1em; padding: 16px; }
    .verb-btn { padding: 8px 16px; font-size: 1em; }
    .blank-slot { min-width: 60px; height: 36px; }
    .check-btn, .next-btn, .reset-btn, .hint-btn { padding: 12px 24px; font-size: 1em; }
    #result-screen h2 { font-size: 1.8em; }
    .game-header { flex-wrap: wrap; gap: 8px; }
    .progress-bar-wrap { order: 3; flex-basis: 100%; margin: 5px 0 0 0; }
  }
</style>
</head>
<body>

<!-- Floating Bubbles -->
<div class="bubbles" id="bubbles"></div>

<!-- ====== WELCOME SCREEN ====== -->
<div class="container">
  <div id="welcome-screen">
    <span class="mascot">🏫</span>
    <h1>動詞小達人</h1>
    <p class="subtitle">中文填詞大挑戰<br>選出最合適的動詞，完成精彩段落！</p>
    <button class="start-btn" onclick="startGame()">開始挑戰 ➜</button>
  </div>

  <!-- ====== GAME SCREEN ====== -->
  <div id="game-screen">
    <!-- Header -->
    <div class="game-header">
      <span class="level-badge" id="level-badge">第 1 關</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="score-display"><span class="star">★</span> <span id="score-num">0</span> 分</span>
    </div>

    <!-- Main Card -->
    <div class="game-card">
      <!-- Task -->
      <div class="task-section">
        <div class="coach-badge"><span class="emoji">📝</span> 小作家任務</div>
        <div class="task-text" id="task-text"></div>
      </div>
      <!-- Toolbox -->
      <div class="toolbox-section">
        <div class="toolbox-label"><span class="icon">🔧</span> 動詞工具箱</div>
        <div class="verb-grid" id="verb-grid"></div>
      </div>
      <!-- Passage -->
      <div class="passage-section">
        <div class="passage-area" id="passage-area"></div>
      </div>
      <!-- Goal -->
      <div class="goal-section">
        <span class="goal-icon">🎯</span>
        <span class="goal-text" id="goal-text"></span>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-row">
      <button class="hint-btn" id="hint-btn" onclick="showHint()">💡 提示</button>
      <button class="reset-btn" onclick="resetLevel()">🔄 重置</button>
      <button class="check-btn" id="check-btn" onclick="checkAnswers()" disabled>✅ 提交答案</button>
      <button class="next-btn" id="next-btn" onclick="nextLevel()">下一關 ➜</button>
    </div>
  </div>

  <!-- ====== RESULT SCREEN ====== -->
  <div id="result-screen">
    <span class="trophy">🏆</span>
    <h2>挑戰完成！</h2>
    <div class="final-score" id="final-score"></div>
    <div class="stars-display" id="final-stars"></div>
    <div class="result-detail" id="result-detail"></div>
    <button class="start-btn" onclick="restartGame()">再玩一次 🔁</button>
  </div>
</div>

<!-- Feedback Overlay -->
<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-card" id="feedback-card"></div>
</div>

<!-- Hint Popup -->
<div class="hint-popup" id="hint-popup"></div>

<script>
// ══════════════════════════════════════════
//  LEVEL DATA
// ══════════════════════════════════════════
const levels = [
  {
    title: "暴風雨中趕路",
    task: '任務：描寫一個在暴風雨中趕回家的人，表現出<span class="keyword">焦急</span>的心情。',
    goal: "目標：讓讀者感受到暴風雨的猛烈和趕路人的焦急！",
    verbs: ["奔跑","搖晃","呼嘯","閃爍","顫抖","凝視","飄散","敲打"],
    segments: [
      "「暴風雨來了！他在雨中拼命地",
      "，狂風在耳邊不停地",
      "，全身被淋濕，忍不住",
      "起來。」"
    ],
    answers: ["奔跑","呼嘯","顫抖"],
    hints: [
      "第①格：人在雨中急著趕路，會用腳做什麼動作？",
      "第②格：風發出的聲音，像是在「叫」一樣……",
      "第③格：淋濕後身體會不自覺地……？"
    ]
  },
  {
    title: "廚房大展身手",
    task: '任務：描寫一位在廚房大展身手的廚師，表現出<span class="keyword">熟練</span>的技術。',
    goal: "目標：讓讀者彷彿聞到廚房裡的陣陣香味！",
    verbs: ["翻炒","攪拌","切碎","瀰漫","灑落","凝望","品嚐","燉煮"],
    segments: [
      "「廚師先俐落地",
      "了蔬菜和肉片，接著熟練地",
      "鍋中的食材，不一會兒，陣陣香味就在廚房裡",
      "開來。」"
    ],
    answers: ["切碎","翻炒","瀰漫"],
    hints: [
      "第①格：把蔬菜變成小塊的動作是……",
      "第②格：鍋鏟在鍋裡上下左右的動作叫……",
      "第③格：香味在空氣中慢慢散開，可以用哪個詞？"
    ]
  },
  {
    title: "考場上的緊張",
    task: '任務：描寫一個在考試中緊張作答的學生，表現出<span class="keyword">專注</span>。',
    goal: "目標：讓讀者感受到考場上分秒必爭的緊張氣氛！",
    verbs: ["書寫","思索","塗改","翻閱","嘆息","抖動","瞪視","默念"],
    segments: [
      "「考試鈴聲響起，小華拿起筆飛快地",
      "，遇到不會的題目就停下來認真",
      "，發現寫錯了連忙用力",
      "。」"
    ],
    answers: ["書寫","思索","塗改"],

// ══════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════
let currentLevel = 0;
let score = 0;
let totalBlanks = 0;
let correctBlanks = 0;
let selectedVerb = null;
let filledSlots = {};   // slotIndex -> verb
let hintsUsed = 0;
const maxHintsPerLevel = 1;
let levelHintUsed = false;
let currentHintIndex = 0;

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
createBubbles();

function createBubbles() {
  const container = document.getElementById('bubbles');
  const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FECA57','#FF9FF3','#54A0FF','#F97F51'];
  for (let i = 0; i < 20; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = Math.random() * 80 + 20;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + '%';
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.style.animationDuration = (Math.random() * 15 + 10) + 's';
    b.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(b);
  }
}

// ══════════════════════════════════════════
//  GAME FLOW
// ══════════════════════════════════════════
function startGame() {
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('game-screen').style.display = 'block';
  document.getElementById('result-screen').style.display = 'none';
  currentLevel = 0;
  score = 0;
  totalBlanks = 0;
  correctBlanks = 0;
  document.getElementById('score-num').textContent = '0';
  loadLevel();
}

function restartGame() {
  document.getElementById('result-screen').style.display = 'none';
  document.getElementById('welcome-screen').style.display = 'block';
}

function loadLevel() {
  const lvl = levels[currentLevel];
  selectedVerb = null;
  filledSlots = {};
  levelHintUsed = false;
  currentHintIndex = 0;

  // Update header
  document.getElementById('level-badge').textContent = `第 ${currentLevel + 1} 關`;
  document.getElementById('progress-fill').style.width = ((currentLevel) / levels.length * 100) + '%';
  document.getElementById('score-num').textContent = score;

  // Task
  document.getElementById('task-text').innerHTML = lvl.task;

  // Goal
  document.getElementById('goal-text').textContent = lvl.goal;

  // Verbs — shuffle
  const shuffled = [...lvl.verbs].sort(() => Math.random() - 0.5);
  const grid = document.getElementById('verb-grid');
  grid.innerHTML = '';
  shuffled.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = `verb-btn verb-color-${i % 8}`;
    btn.textContent = v;
    btn.dataset.verb = v;
    btn.onclick = () => selectVerb(btn);
    grid.appendChild(btn);
  });

  // Passage
  const area = document.getElementById('passage-area');
  area.innerHTML = '';
  lvl.segments.forEach((seg, i) => {
    const span = document.createElement('span');
    span.innerHTML = seg;
    area.appendChild(span);
    if (i < lvl.answers.length) {
      const slot = document.createElement('span');
      slot.className = 'blank-slot pulse';
      slot.dataset.index = i;
      slot.innerHTML = `<span class="blank-num">${i + 1}</span>`;
      slot.onclick = () => clickSlot(slot);
      area.appendChild(slot);
    }
  });

  // Buttons
  document.getElementById('check-btn').disabled = true;
  document.getElementById('check-btn').style.display = '';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('hint-btn').disabled = false;

  // Animate card in
  document.querySelector('.game-card').style.animation = 'none';
  requestAnimationFrame(() => {
    document.querySelector('.game-card').style.animation = 'fadeInUp 0.5s ease';
  });
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function selectVerb(btn) {
  if (btn.classList.contains('used')) return;

  // Deselect previous
  document.querySelectorAll('.verb-btn.selected').forEach(b => b.classList.remove('selected'));

  if (selectedVerb === btn.dataset.verb) {
    selectedVerb = null;
    return;
  }

  btn.classList.add('selected');
  selectedVerb = btn.dataset.verb;
  playSound('select');
}

function clickSlot(slot) {
  const idx = parseInt(slot.dataset.index);

  // If slot has a verb, remove it
  if (filledSlots[idx]) {
    const removedVerb = filledSlots[idx];
    delete filledSlots[idx];
    slot.classList.remove('filled');
    slot.classList.add('pulse');
    slot.innerHTML = `<span class="blank-num">${idx + 1}</span>`;

    // Re-enable the verb button
    document.querySelectorAll('.verb-btn').forEach(b => {
      if (b.dataset.verb === removedVerb) {
        b.classList.remove('used');
      }
    });
    playSound('remove');
    updateCheckBtn();
    return;
  }

  // If a verb is selected, place it
  if (selectedVerb) {
    filledSlots[idx] = selectedVerb;
    slot.classList.add('filled');
    slot.classList.remove('pulse');
    slot.innerHTML = `<span class="blank-num">${idx + 1}</span>${selectedVerb}`;

    // Mark verb button as used
    document.querySelectorAll('.verb-btn').forEach(b => {
      if (b.dataset.verb === selectedVerb) {
        b.classList.add('used');
        b.classList.remove('selected');
      }
    });

    selectedVerb = null;
    playSound('place');
    updateCheckBtn();
  }
}

function updateCheckBtn() {
  const lvl = levels[currentLevel];
  const allFilled = Object.keys(filledSlots).length === lvl.answers.length;
  document.getElementById('check-btn').disabled = !allFilled;
}

// ══════════════════════════════════════════
//  CHECK ANSWERS
// ══════════════════════════════════════════
function checkAnswers() {
  const lvl = levels[currentLevel];
  let correct = 0;
  const slots = document.querySelectorAll('.blank-slot');
  const details = [];

  slots.forEach((slot, i) => {
    const userAnswer = filledSlots[i];
    const correctAnswer = lvl.answers[i];
    if (userAnswer === correctAnswer) {
      slot.classList.add('correct');
      correct++;
      details.push(`<span class="correct-mark">✓ 第${i+1}格「${userAnswer}」正確！</span>`);
    } else {
      slot.classList.add('wrong');
      details.push(`<span class="wrong-mark">✗ 第${i+1}格 你填了「${userAnswer}」，正確答案是「${correctAnswer}」</span>`);
    }
  });

  totalBlanks += lvl.answers.length;
  correctBlanks += correct;

  // Calculate level score
  const levelScore = correct * 10;
  score += levelScore;
  document.getElementById('score-num').textContent = score;

  // Show feedback
  const allCorrect = correct === lvl.answers.length;
  showFeedback(allCorrect, correct, lvl.answers.length, details, levelScore);

  // Disable check, show next
  document.getElementById('check-btn').style.display = 'none';
  document.getElementById('next-btn').style.display = '';
  document.getElementById('hint-btn').disabled = true;

  // Disable verb buttons
  document.querySelectorAll('.verb-btn').forEach(b => {
    b.style.pointerEvents = 'none';
  });
  document.querySelectorAll('.blank-slot').forEach(s => {
    s.style.pointerEvents = 'none';
  });

  if (allCorrect) {
    playSound('success');
    spawnConfetti();
  } else {
    playSound('fail');
  }
}

function showFeedback(allCorrect, correct, total, details, pts) {
  const overlay = document.getElementById('feedback-overlay');
  const card = document.getElementById('feedback-card');

  const icon = allCorrect ? '🎉' : (correct > 0 ? '💪' : '😅');
  const title = allCorrect ? '完美通關！' : (correct > 0 ? '差一點點！' : '再接再厲！');
  const msg = allCorrect
    ? `太棒了！全部答對，獲得 ${pts} 分！`
    : `答對了 ${correct}/${total} 題，獲得 ${pts} 分。`;
  const btnClass = allCorrect ? 'fb-btn-success' : 'fb-btn-retry';
  const btnText = allCorrect ? '太好了！' : '知道了！';

  card.innerHTML = `
    <div class="fb-icon">${icon}</div>
    <h3>${title}</h3>
    <p>${msg}</p>
    <div class="fb-detail">${details.join('<br>')}</div>
    <button class="fb-btn ${btnClass}" onclick="closeFeedback()">${btnText}</button>
  `;
  overlay.classList.add('show');
}

function closeFeedback() {
  document.getElementById('feedback-overlay').classList.remove('show');
}

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function nextLevel() {
  closeFeedback();
  currentLevel++;
  if (currentLevel >= levels.length) {
    showResults();
  } else {
    loadLevel();
  }
}

function resetLevel() {
  loadLevel();
  playSound('select');
}

function showResults() {
  document.getElementById('game-screen').style.display = 'none';
  document.getElementById('result-screen').style.display = 'block';

  const maxScore = levels.reduce((s, l) => s + l.answers.length * 10, 0);
  const pct = Math.round(score / maxScore * 100);

  document.getElementById('final-score').textContent = `總分：${score} / ${maxScore} 分`;

  // Stars
  let starCount = 0;
  if (pct >= 90) starCount = 3;
  else if (pct >= 60) starCount = 2;
  else if (pct >= 30) starCount = 1;

  let starsHtml = '';
  for (let i = 0; i < 3; i++) {
    starsHtml += i < starCount ? '⭐' : '<span class="star-empty">⭐</span>';
  }
  document.getElementById('final-stars').innerHTML = starsHtml;

  const messages = [
    "加油，多練習就會進步的！",
    "不錯的表現，繼續努力！",
    "很好！你對動詞的理解越來越好了！",
    "太厲害了！你是動詞小達人！"
  ];
  document.getElementById('result-detail').innerHTML = `
    正確率：${pct}%<br>
    ${messages[starCount]}<br>
    答對 ${correctBlanks} / ${totalBlanks} 個空格
  `;

  if (starCount >= 2) spawnConfetti();
}

// ══════════════════════════════════════════
//  HINTS
// ══════════════════════════════════════════
function showHint() {
  if (levelHintUsed) return;

  const lvl = levels[currentLevel];
  // Find first empty slot
  let hintIdx = -1;
  for (let i = 0; i < lvl.answers.length; i++) {
    if (!filledSlots[i]) { hintIdx = i; break; }
  }
  if (hintIdx === -1) {
    // Find first wrong slot
    for (let i = 0; i < lvl.answers.length; i++) {
      if (filledSlots[i] !== lvl.answers[i]) { hintIdx = i; break; }
    }
  }
  if (hintIdx === -1) return;

  const popup = document.getElementById('hint-popup');
  popup.textContent = '💡 ' + lvl.hints[hintIdx];
  popup.classList.add('show');
  levelHintUsed = true;
  document.getElementById('hint-btn').disabled = true;

  setTimeout(() => { popup.classList.remove('show'); }, 4000);
  playSound('hint');
}

// ══════════════════════════════════════════
//  SOUNDS (Web Audio API — simple beeps)
// ══════════════════════════════════════════
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    switch(type) {
      case 'select':
        osc.frequency.value = 600;
        gain.gain.value = 0.08;
        osc.start(); osc.stop(ctx.currentTime + 0.08);
        break;
      case 'place':
        osc.frequency.value = 800;
        gain.gain.value = 0.1;
        osc.start(); osc.stop(ctx.currentTime + 0.1);
        break;
      case 'remove':
        osc.frequency.value = 400;
        gain.gain.value = 0.08;
        osc.start(); osc.stop(ctx.currentTime + 0.1);
        break;
      case 'success':
        osc.type = 'triangle';
        osc.frequency.value = 523;
        gain.gain.value = 0.12;
        osc.start();
        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.15);
        osc.frequency.setValueAtTime(784, ctx.currentTime + 0.3);
        osc.stop(ctx.currentTime + 0.5);
        break;
      case 'fail':
        osc.type = 'sawtooth';
        osc.frequency.value = 300;
        gain.gain.value = 0.08;
        osc.start();
        osc.frequency.setValueAtTime(250, ctx.currentTime + 0.15);
        osc.stop(ctx.currentTime + 0.3);
        break;
      case 'hint':
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.value = 0.06;
        osc.start(); osc.stop(ctx.currentTime + 0.15);
        break;
    }
  } catch(e) {}
}

// ══════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════
function spawnConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#FECA57','#FF9FF3','#54A0FF','#F97F51','#00B894','#6C5CE7'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-10px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (Math.random() * 10 + 5) + 'px';
    el.style.height = (Math.random() * 10 + 5) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);

    const duration = Math.random() * 2000 + 1500;
    const endX = (Math.random() - 0.5) * 200;
    el.animate([
      { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${endX}px, ${window.innerHeight + 20}px) rotate(${Math.random()*720}deg)`, opacity: 0 }
    ], { duration, easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)' });

    setTimeout(() => el.remove(), duration);
  }
}

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動詞小達人 — 描寫性格特徵</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #6C5CE7;
    --secondary: #00B894;
    --accent: #FDCB6E;
    --danger: #E17055;
    --info: #74B9FF;
    --pink: #FD79A8;
    --dark: #2D3436;
    --light: #F8F9FA;
  }

  html, body {
    font-family: 'Noto Sans TC', sans-serif;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
  }

  /* ── Floating Bubbles ── */
  .bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bubble {
    position: absolute; border-radius: 50%; opacity: 0.12;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 0.12; } 90% { opacity: 0.12; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* ── Welcome Screen ── */
  #welcome-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; text-align: center; animation: fadeInUp 0.8s ease; position: relative; z-index: 1;
  }
  .mascot { font-size: 90px; animation: bounce 2s ease infinite; }
  #welcome-screen h1 {
    font-size: 3.2em; font-weight: 900; color: #fff;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.15); letter-spacing: 6px; margin: 8px 0;
  }
  .subtitle { font-size: 1.3em; color: rgba(255,255,255,0.9); margin-bottom: 30px; }
  .start-btn {
    padding: 16px 56px; font-size: 1.4em; font-weight: 700; color: var(--primary);
    background: #fff; border: none; border-radius: 50px; cursor: pointer;
    box-shadow: 0 8px 25px rgba(0,0,0,0.2); transition: all 0.3s; font-family: inherit; letter-spacing: 2px;
  }
  .start-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 12px 35px rgba(0,0,0,0.25); }

  /* ── Game Screen (landscape) ── */
  #game-screen {
    display: none; height: 100vh; padding: 14px 20px;
    flex-direction: column; position: relative; z-index: 1;
  }
  #game-screen.active { display: flex; }

  /* Top bar */
  .top-bar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; margin-bottom: 10px;
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px); border-radius: 14px;
    flex-shrink: 0;
  }
  .level-badge {
    background: var(--accent); color: var(--dark);
    padding: 4px 16px; border-radius: 20px; font-weight: 700; font-size: 0.95em; white-space: nowrap;
  }
  .progress-wrap {
    flex: 1; height: 8px; background: rgba(255,255,255,0.25); border-radius: 8px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--danger));
    border-radius: 8px; transition: width 0.5s ease;
  }
  .score-display { color: #fff; font-weight: 700; font-size: 1em; white-space: nowrap; }
  .score-display .star { color: var(--accent); }

  /* Main area — two-column */
  .main-area {
    flex: 1; display: flex; gap: 16px; min-height: 0; overflow: hidden;
  }

  /* Left Panel */
  .left-panel {
    flex: 0 0 38%; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .task-card {
    background: linear-gradient(135deg, #2d3436, #636e72); color: #fff;
    border-radius: 18px; padding: 18px 22px; flex-shrink: 0;
  }
  .coach-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent); color: var(--dark);
    padding: 3px 12px; border-radius: 16px; font-weight: 700; font-size: 0.85em; margin-bottom: 8px;
  }
  .task-text { font-size: 1.05em; line-height: 1.7; }
  .keyword {
    display: inline-block; background: var(--accent); color: var(--dark);
    padding: 1px 8px; border-radius: 5px; font-weight: 700;
  }

  .toolbox-card {
    background: #fff; border-radius: 18px; padding: 16px 20px;
    flex: 1; min-height: 0; overflow-y: auto;
  }
  .toolbox-label {
    display: flex; align-items: center; gap: 6px;
    font-weight: 700; font-size: 0.95em; color: var(--dark); margin-bottom: 12px;
  }
  .toolbox-label .icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; background: var(--primary); color: #fff; border-radius: 7px; font-size: 0.85em;
  }
  .verb-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .verb-btn {
    padding: 9px 20px; font-size: 1.1em; font-weight: 700; border: 3px solid transparent;
    border-radius: 12px; cursor: pointer; transition: all 0.25s; font-family: inherit;
    letter-spacing: 2px; user-select: none;
  }
  .verb-btn:hover:not(.used):not(.selected) { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0,0,0,0.12); }
  .verb-btn.selected { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--dark); z-index: 2; }
  .verb-btn.used { opacity: 0.3; cursor: default; transform: scale(0.95); }
  .vc0 { background: #FF6B6B; color: #fff; }
  .vc1 { background: #4ECDC4; color: #fff; }
  .vc2 { background: #45B7D1; color: #fff; }
  .vc3 { background: #96CEB4; color: var(--dark); }
  .vc4 { background: #FECA57; color: var(--dark); }
  .vc5 { background: #FF9FF3; color: var(--dark); }
  .vc6 { background: #54A0FF; color: #fff; }
  .vc7 { background: #F97F51; color: #fff; }

  /* Right Panel */
  .right-panel {
    flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }
  .passage-card {
    background: #fff; border-radius: 18px; padding: 24px 28px;
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; justify-content: center;
  }
  .passage-area {
    background: #f8f9fa; border-radius: 14px; padding: 22px;
    font-size: 1.3em; line-height: 2.4; color: var(--dark); border: 2px solid #eee;
  }
  .blank-slot {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 72px; height: 42px; border: 3px dashed var(--primary); border-radius: 10px;
    margin: 0 3px; padding: 0 10px; cursor: pointer; transition: all 0.3s;
    vertical-align: middle; position: relative; background: rgba(108,92,231,0.06);
    font-weight: 700; font-size: 0.9em; letter-spacing: 2px;
  }
  .blank-slot:hover { border-color: var(--danger); background: rgba(225,112,85,0.08); }
  .blank-slot.filled { border-style: solid; background: var(--primary); color: #fff; border-color: var(--primary); animation: popIn 0.3s ease; }
  .blank-slot.correct { background: var(--secondary) !important; border-color: var(--secondary) !important; animation: correctPulse 0.6s ease; }
  .blank-slot.wrong { background: var(--danger) !important; border-color: var(--danger) !important; animation: shake 0.5s ease; }
  .blank-slot .blank-num {
    position: absolute; top: -10px; left: -10px;
    width: 20px; height: 20px; background: var(--accent); color: var(--dark);
    border-radius: 50%; font-size: 0.6em; display: flex; align-items: center; justify-content: center; font-weight: 900;
  }
  .blank-slot.pulse { animation: pulseBlank 1.5s ease infinite; }

  .goal-bar {
    background: linear-gradient(90deg, #dfe6e9, #b2bec3);
    padding: 10px 20px; border-radius: 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  }
  .goal-bar .goal-text { font-size: 0.9em; color: var(--dark); font-weight: 500; }

  /* Bottom Nav */
  .bottom-nav {
    display: flex; justify-content: center; align-items: center; gap: 12px;
    padding: 10px 0 4px; flex-shrink: 0;
  }
  .nav-btn {
    padding: 10px 30px; font-size: 1.05em; font-weight: 700; border: none; border-radius: 12px;
    cursor: pointer; transition: all 0.3s; font-family: inherit; letter-spacing: 1px;
  }
  .nav-btn:hover:not(:disabled) { transform: translateY(-2px); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .btn-prev {
    background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(5px); border: 2px solid rgba(255,255,255,0.3);
  }
  .btn-reset {
    background: rgba(255,255,255,0.2); color: #fff; backdrop-filter: blur(5px); border: 2px solid rgba(255,255,255,0.3);
  }
  .btn-check {
    background: linear-gradient(135deg, var(--primary), #a29bfe); color: #fff;
    box-shadow: 0 4px 15px rgba(108,92,231,0.4); padding: 10px 40px;
  }
  .btn-next {
    background: linear-gradient(135deg, var(--secondary), #55efc4); color: #fff;
    box-shadow: 0 4px 15px rgba(0,184,148,0.4);
  }
  .level-dots {
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s;
  }
  .dot.active { background: var(--accent); transform: scale(1.3); }
  .dot.done { background: var(--secondary); }

  /* ── Feedback Modal ── */
  .feedback-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; align-items: center; justify-content: center;
  }
  .feedback-overlay.show { display: flex; }
  .feedback-card {
    background: #fff; border-radius: 22px; padding: 32px; max-width: 480px; width: 90%;
    text-align: center; animation: popIn 0.4s ease;
  }
  .fb-icon { font-size: 56px; margin-bottom: 8px; }
  .feedback-card h3 { font-size: 1.4em; margin-bottom: 6px; }
  .feedback-card p { color: #636e72; font-size: 0.95em; line-height: 1.6; }
  .fb-detail {
    margin-top: 10px; padding: 12px; background: #f8f9fa; border-radius: 10px;
    text-align: left; font-size: 0.92em; line-height: 1.8;
  }
  .correct-mark { color: var(--secondary); font-weight: 700; }
  .wrong-mark { color: var(--danger); font-weight: 700; }
  .fb-btn {
    margin-top: 14px; padding: 10px 36px; font-size: 1.05em; font-weight: 700;
    border: none; border-radius: 10px; cursor: pointer; font-family: inherit; transition: all 0.3s;
  }
  .fb-btn:hover { transform: translateY(-2px); }
  .fb-btn-success { background: var(--secondary); color: #fff; }
  .fb-btn-retry { background: var(--danger); color: #fff; }

  /* ── Result Screen ── */
  #result-screen {
    display: none; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; text-align: center; animation: fadeInUp 0.8s ease; position: relative; z-index: 1;
  }
  #result-screen.active { display: flex; }
  .trophy { font-size: 90px; animation: bounce 2s ease infinite; }
  #result-screen h2 { font-size: 2.5em; color: #fff; text-shadow: 3px 3px 0 rgba(0,0,0,0.15); margin: 8px 0; }
  .final-score { font-size: 1.4em; color: var(--accent); font-weight: 700; }
  .stars-display { font-size: 2.8em; margin: 10px 0; }
  .star-empty { opacity: 0.3; }
  .result-detail { color: rgba(255,255,255,0.85); font-size: 1.05em; margin-bottom: 24px; line-height: 1.8; }

  /* ── Animations ── */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  @keyframes correctPulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes pulseBlank { 0%,100% { box-shadow: 0 0 0 0 rgba(108,92,231,0.3); } 50% { box-shadow: 0 0 0 8px rgba(108,92,231,0); } }
  .confetti-piece { position: fixed; z-index: 200; pointer-events: none; }

  /* Portrait warning for very narrow screens */
  @media (max-width: 700px) and (orientation: portrait) {
    body::after {
      content: '📱 請將裝置轉為橫向使用';
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5em; font-weight: 700; z-index: 9999; letter-spacing: 2px;
    }
  }
</style>
</head>
<body>

<div class="bubbles" id="bubbles"></div>

<!-- ====== WELCOME ====== -->
<div id="welcome-screen">
  <span class="mascot">🏫</span>
  <h1>動詞小達人</h1>
  <p class="subtitle">性格特徵描寫大挑戰<br>選出最合適的動詞，寫活人物性格！</p>
  <button class="start-btn" onclick="startGame()">開始挑戰 ➜</button>
</div>

<!-- ====== GAME ====== -->
<div id="game-screen">
  <!-- Top Bar -->
  <div class="top-bar">
    <span class="level-badge" id="level-badge">第 1 關</span>
    <div class="level-dots" id="level-dots"></div>
    <div class="progress-wrap"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="score-display"><span class="star">★</span> <span id="score-num">0</span> 分</span>
  </div>

  <!-- Main Two-Column -->
  <div class="main-area">
    <!-- Left -->
    <div class="left-panel">
      <div class="task-card">
        <div class="coach-badge"><span>📝</span> 小作家任務</div>
        <div class="task-text" id="task-text"></div>
      </div>
      <div class="toolbox-card">
        <div class="toolbox-label"><span class="icon">🔧</span> 動詞工具箱</div>
        <div class="verb-grid" id="verb-grid"></div>
      </div>
    </div>
    <!-- Right -->
    <div class="right-panel">
      <div class="passage-card">
        <div class="passage-area" id="passage-area"></div>
      </div>
      <div class="goal-bar">
        <span>🎯</span>
        <span class="goal-text" id="goal-text"></span>
      </div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn btn-prev" id="btn-prev" onclick="prevLevel()">⬅ 上一題</button>
    <button class="nav-btn btn-reset" onclick="resetLevel()">🔄 重置</button>
    <button class="nav-btn btn-check" id="btn-check" onclick="checkAnswers()" disabled>✅ 提交答案</button>
    <button class="nav-btn btn-next" id="btn-next" onclick="nextLevel()" style="display:none">下一題 ➜</button>
  </div>
</div>

<!-- ====== RESULT ====== -->
<div id="result-screen">
  <span class="trophy">🏆</span>
  <h2>挑戰完成！</h2>
  <div class="final-score" id="final-score"></div>
  <div class="stars-display" id="final-stars"></div>
  <div class="result-detail" id="result-detail"></div>
  <button class="start-btn" onclick="restartGame()">再玩一次 🔁</button>
</div>

<!-- Feedback Overlay -->
<div class="feedback-overlay" id="feedback-overlay">
  <div class="feedback-card" id="feedback-card"></div>
</div>

<script>
// ══════════════════════════════════════════
//  LEVEL DATA — 性格特徵描寫
// ══════════════════════════════════════════
const levels = [
  {
    title: "堅毅",
    task: '任務：描寫一個練跑時不斷跌倒又爬起來的運動員，表現出<span class="keyword">堅毅</span>的性格。',
    goal: "目標：讓讀者感受到運動員永不放棄的堅毅精神！",
    verbs: ["咬緊","跌倒","攀爬","揮灑","喘息","癱坐","撐起","放棄"],
    segments: [
      "「比賽途中，他不小心",
      "在跑道上，但他立刻",
      "身體，",
      "牙關繼續向終點衝去。」"
    ],
    answers: ["跌倒","撐起","咬緊"]
  },
  {
    title: "善良",
    task: '任務：描寫一個主動幫助迷路老婆婆的同學，表現出<span class="keyword">善良</span>的性格。',
    goal: "目標：讓讀者感受到同學溫暖、體貼的善心！",
    verbs: ["攙扶","牽領","詢問","注視","陪伴","招呼","指引","安慰"],
    segments: [
      "「小芳看到路邊迷路的老婆婆，連忙走上前",
      "情況，然後輕輕地",
      "著她，一路",
      "她走到家門口。」"
    ],
    answers: ["詢問","攙扶","陪伴"]
  },
  {
    title: "勇敢",
    task: '任務：描寫一個在颱風天救出被困小貓的同學，表現出<span class="keyword">勇敢</span>的性格。',
    goal: "目標：讓讀者看見他不顧危險也要幫助弱小的勇氣！",
    verbs: ["衝進","抱緊","躲避","呼喊","顫抖","鑽入","安撫","搖晃"],
    segments: [
      "「聽到小貓的叫聲，他不顧狂風暴雨，",
      "了巷子裡，小心翼翼地把小貓",
      "在懷中，輕聲地",
      "牠的不安。」"
    ],
    answers: ["衝進","抱緊","安撫"]
  },
  {
    title: "細心",
    task: '任務：描寫一個照顧生病同學的班長，表現出<span class="keyword">細心</span>的性格。',
    goal: "目標：讓讀者感受到班長無微不至的關懷！",
    verbs: ["觸摸","遞上","叮嚀","觀察","覆蓋","催促","記錄","張望"],
    segments: [
      "「小班長發現同學臉色蒼白，馬上用手",
      "他的額頭，然後",
      "一杯溫水，還不斷",
      "他要好好休息。」"
    ],
    answers: ["觸摸","遞上","叮嚀"]
  },
  {
    title: "樂觀",
    task: '任務：描寫一個考試失敗後仍然積極面對的同學，表現出<span class="keyword">樂觀</span>的性格。',
    goal: "目標：讓讀者感受到他面對挫折時的正面力量！",
    verbs: ["微笑","拍拍","鼓勵","哭泣","握緊","埋怨","振作","嘆息"],
    segments: [
      "「看到不理想的成績，小強沒有沮喪，反而",
      "著對自己說加油，他",
      "拳頭暗暗下定決心，還主動",
      "其他考差了的同學。」"
    ],
    answers: ["微笑","握緊","鼓勵"]
  },
  {
    title: "勤勞",
    task: '任務：描寫一個每天一大早就起來做家務的孩子，表現出<span class="keyword">勤勞</span>的性格。',
    goal: "目標：讓讀者看到一個主動分擔家務的好孩子！",
    verbs: ["擦拭","掃除","摺疊","整理","搬運","沖洗","晾曬","收拾"],
    segments: [
      "「天剛亮，小玲已經開始",
      "桌椅，接著認真地",
      "地上的灰塵，最後把洗好的衣服一件件",
      "整齊，才安心去上學。」"
    ],
    answers: ["擦拭","掃除","摺疊"]
  }
];

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let currentLevel = 0;
let score = 0;
let totalBlanks = 0;
let correctBlanks = 0;
let selectedVerb = null;
let filledSlots = {};
let levelResults = [];   // per-level: null = not attempted, true = perfect, false = attempted
let levelLocked = [];    // true after submit

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
(function createBubbles() {
  const c = document.getElementById('bubbles');
  const colors = ['#FF6B6B','#4ECDC4','#45B7D1','#96CEB4','#FECA57','#FF9FF3','#54A0FF','#F97F51'];
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const s = Math.random() * 70 + 20;
    b.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${colors[i%8]};animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s`;
    c.appendChild(b);
  }
})();

function buildDots() {
  const wrap = document.getElementById('level-dots');
  wrap.innerHTML = '';
  levels.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === currentLevel ? ' active' : '') + (levelResults[i] === true ? ' done' : '');
    wrap.appendChild(d);
  });
}

// ══════════════════════════════════════════
//  GAME FLOW
// ══════════════════════════════════════════
function startGame() {
  document.getElementById('welcome-screen').style.display = 'none';
  document.getElementById('game-screen').classList.add('active');
  document.getElementById('result-screen').classList.remove('active');
  currentLevel = 0; score = 0; totalBlanks = 0; correctBlanks = 0;
  levelResults = levels.map(() => null);
  levelLocked = levels.map(() => false);
  document.getElementById('score-num').textContent = '0';
  loadLevel();
}

function restartGame() {
  document.getElementById('result-screen').classList.remove('active');
  document.getElementById('welcome-screen').style.display = '';
}

function loadLevel() {
  const lvl = levels[currentLevel];
  const locked = levelLocked[currentLevel];
  selectedVerb = null;
  if (!locked) filledSlots = {};

  // Header
  document.getElementById('level-badge').textContent = `第 ${currentLevel + 1} 關：${lvl.title}`;
  document.getElementById('progress-fill').style.width = ((currentLevel) / levels.length * 100) + '%';
  document.getElementById('score-num').textContent = score;
  buildDots();

  // Task & Goal
  document.getElementById('task-text').innerHTML = lvl.task;
  document.getElementById('goal-text').textContent = lvl.goal;

  // Verbs
  const shuffled = locked ? [...lvl.verbs] : [...lvl.verbs].sort(() => Math.random() - 0.5);
  const grid = document.getElementById('verb-grid');
  grid.innerHTML = '';
  shuffled.forEach((v, i) => {
    const btn = document.createElement('button');
    btn.className = `verb-btn vc${i % 8}`;
    btn.textContent = v;
    btn.dataset.verb = v;
    if (locked) {
      btn.classList.add('used');
      btn.style.pointerEvents = 'none';
    } else {
      btn.onclick = () => selectVerb(btn);
      // Mark used if already filled
      if (Object.values(filledSlots).includes(v)) btn.classList.add('used');
    }
    grid.appendChild(btn);
  });

  // Passage
  const area = document.getElementById('passage-area');
  area.innerHTML = '';
  lvl.segments.forEach((seg, i) => {
    const span = document.createElement('span');
    span.innerHTML = seg;
    area.appendChild(span);
    if (i < lvl.answers.length) {
      const slot = document.createElement('span');
      slot.className = 'blank-slot' + (!locked ? ' pulse' : '');
      slot.dataset.index = i;
      slot.innerHTML = `<span class="blank-num">${i + 1}</span>`;
      if (locked) {
        // Show results
        const savedAnswer = lvl._userAnswers ? lvl._userAnswers[i] : lvl.answers[i];
        const isCorrect = savedAnswer === lvl.answers[i];
        slot.classList.add('filled', isCorrect ? 'correct' : 'wrong');
        slot.innerHTML = `<span class="blank-num">${i + 1}</span>${savedAnswer}`;
        slot.style.pointerEvents = 'none';
      } else {
        slot.onclick = () => clickSlot(slot);
      }
      area.appendChild(slot);
    }
  });

  // Nav buttons
  document.getElementById('btn-prev').disabled = currentLevel === 0;
  if (locked) {
    document.getElementById('btn-check').style.display = 'none';
    document.getElementById('btn-next').style.display = '';
    if (currentLevel >= levels.length - 1 && levelLocked.every(Boolean)) {
      document.getElementById('btn-next').textContent = '查看成績 🏆';
    } else {
      document.getElementById('btn-next').textContent = '下一題 ➜';
    }
  } else {
    document.getElementById('btn-check').style.display = '';
    document.getElementById('btn-check').disabled = true;
    document.getElementById('btn-next').style.display = 'none';
  }

  // Animate
  document.querySelector('.main-area').style.animation = 'none';
  requestAnimationFrame(() => { document.querySelector('.main-area').style.animation = 'fadeInUp 0.4s ease'; });
}

// ══════════════════════════════════════════
//  INTERACTION
// ══════════════════════════════════════════
function selectVerb(btn) {
  if (btn.classList.contains('used')) return;
  document.querySelectorAll('.verb-btn.selected').forEach(b => b.classList.remove('selected'));
  if (selectedVerb === btn.dataset.verb) { selectedVerb = null; return; }
  btn.classList.add('selected');
  selectedVerb = btn.dataset.verb;
  playSound('select');
}

function clickSlot(slot) {
  const idx = parseInt(slot.dataset.index);
  if (filledSlots[idx]) {
    const removed = filledSlots[idx];
    delete filledSlots[idx];
    slot.classList.remove('filled');
    slot.classList.add('pulse');
    slot.innerHTML = `<span class="blank-num">${idx + 1}</span>`;
    document.querySelectorAll('.verb-btn').forEach(b => { if (b.dataset.verb === removed) b.classList.remove('used'); });
    playSound('remove');
    updateCheckBtn();
    return;
  }
  if (selectedVerb) {
    filledSlots[idx] = selectedVerb;
    slot.classList.add('filled');
    slot.classList.remove('pulse');
    slot.innerHTML = `<span class="blank-num">${idx + 1}</span>${selectedVerb}`;
    document.querySelectorAll('.verb-btn').forEach(b => {
      if (b.dataset.verb === selectedVerb) { b.classList.add('used'); b.classList.remove('selected'); }
    });
    selectedVerb = null;
    playSound('place');
    updateCheckBtn();
  }
}

function updateCheckBtn() {
  const lvl = levels[currentLevel];
  document.getElementById('btn-check').disabled = Object.keys(filledSlots).length !== lvl.answers.length;
}

// ══════════════════════════════════════════
//  CHECK
// ══════════════════════════════════════════
function checkAnswers() {
  const lvl = levels[currentLevel];
  let correct = 0;
  const slots = document.querySelectorAll('.blank-slot');
  const details = [];
  const userAnswers = [];

  slots.forEach((slot, i) => {
    const ua = filledSlots[i];
    const ca = lvl.answers[i];
    userAnswers.push(ua);
    if (ua === ca) {
      slot.classList.add('correct');
      correct++;
      details.push(`<span class="correct-mark">✓ 第${i+1}格「${ua}」正確！</span>`);
    } else {
      slot.classList.add('wrong');
      details.push(`<span class="wrong-mark">✗ 第${i+1}格 你填了「${ua}」，正確答案是「${ca}」</span>`);
    }
    slot.style.pointerEvents = 'none';
  });

  lvl._userAnswers = userAnswers;
  totalBlanks += lvl.answers.length;
  correctBlanks += correct;
  const pts = correct * 10;
  score += pts;
  document.getElementById('score-num').textContent = score;

  levelResults[currentLevel] = correct === lvl.answers.length;
  levelLocked[currentLevel] = true;
  buildDots();

  document.getElementById('btn-check').style.display = 'none';
  document.getElementById('btn-next').style.display = '';
  if (currentLevel >= levels.length - 1 && levelLocked.every(Boolean)) {
    document.getElementById('btn-next').textContent = '查看成績 🏆';
  }
  document.querySelectorAll('.verb-btn').forEach(b => b.style.pointerEvents = 'none');

  const allCorrect = correct === lvl.answers.length;
  showFeedback(allCorrect, correct, lvl.answers.length, details, pts);
  if (allCorrect) { playSound('success'); spawnConfetti(); } else { playSound('fail'); }
}

function showFeedback(allCorrect, correct, total, details, pts) {
  const card = document.getElementById('feedback-card');
  const icon = allCorrect ? '🎉' : (correct > 0 ? '💪' : '😅');
  const title = allCorrect ? '完美通關！' : (correct > 0 ? '差一點點！' : '再接再厲！');
  const msg = allCorrect ? `太棒了！全部答對，獲得 ${pts} 分！` : `答對了 ${correct}/${total} 題，獲得 ${pts} 分。`;
  const btnCls = allCorrect ? 'fb-btn-success' : 'fb-btn-retry';
  card.innerHTML = `
    <div class="fb-icon">${icon}</div>
    <h3>${title}</h3><p>${msg}</p>
    <div class="fb-detail">${details.join('<br>')}</div>
    <button class="fb-btn ${btnCls}" onclick="closeFeedback()">${allCorrect ? '太好了！' : '知道了！'}</button>`;
  document.getElementById('feedback-overlay').classList.add('show');
}

function closeFeedback() { document.getElementById('feedback-overlay').classList.remove('show'); }

// ══════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════
function prevLevel() {
  if (currentLevel > 0) { currentLevel--; loadLevel(); }
}

function nextLevel() {
  closeFeedback();
  if (currentLevel >= levels.length - 1 && levelLocked.every(Boolean)) {
    showResults();
  } else {
    currentLevel = Math.min(currentLevel + 1, levels.length - 1);
    loadLevel();
  }
}

function resetLevel() {
  if (levelLocked[currentLevel]) return;
  filledSlots = {};
  selectedVerb = null;
  loadLevel();
  playSound('select');
}

function showResults() {
  document.getElementById('game-screen').classList.remove('active');
  document.getElementById('result-screen').classList.add('active');
  const maxScore = levels.reduce((s, l) => s + l.answers.length * 10, 0);
  const pct = Math.round(score / maxScore * 100);
  document.getElementById('final-score').textContent = `總分：${score} / ${maxScore} 分`;
  let stars = pct >= 90 ? 3 : pct >= 60 ? 2 : pct >= 30 ? 1 : 0;
  document.getElementById('final-stars').innerHTML = Array.from({length:3}, (_,i) => i < stars ? '⭐' : '<span class="star-empty">⭐</span>').join('');
  const msgs = ["加油，多練習就會進步的！","不錯的表現，繼續努力！","很好！你對動詞的理解越來越好了！","太厲害了！你是動詞小達人！"];
  document.getElementById('result-detail').innerHTML = `正確率：${pct}%<br>${msgs[stars]}<br>答對 ${correctBlanks} / ${totalBlanks} 個空格`;
  if (stars >= 2) spawnConfetti();
}

// ══════════════════════════════════════════
//  SOUNDS
// ══════════════════════════════════════════
let audioCtx = null;
function getAC() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playSound(t) {
  try {
    const c = getAC(), o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    switch(t) {
      case 'select': o.frequency.value=600; g.gain.value=0.08; o.start(); o.stop(c.currentTime+0.08); break;
      case 'place': o.frequency.value=800; g.gain.value=0.1; o.start(); o.stop(c.currentTime+0.1); break;
      case 'remove': o.frequency.value=400; g.gain.value=0.08; o.start(); o.stop(c.currentTime+0.1); break;
      case 'success': o.type='triangle'; o.frequency.value=523; g.gain.value=0.12; o.start();
        o.frequency.setValueAtTime(659,c.currentTime+0.15); o.frequency.setValueAtTime(784,c.currentTime+0.3); o.stop(c.currentTime+0.5); break;
      case 'fail': o.type='sawtooth'; o.frequency.value=300; g.gain.value=0.08; o.start();
        o.frequency.setValueAtTime(250,c.currentTime+0.15); o.stop(c.currentTime+0.3); break;
    }
  } catch(e) {}
}

// ══════════════════════════════════════════
//  CONFETTI
// ══════════════════════════════════════════
function spawnConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#FECA57','#FF9FF3','#54A0FF','#F97F51','#00B894','#6C5CE7'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `left:${Math.random()*100}vw;top:-10px;background:${colors[i%8]};width:${Math.random()*10+5}px;height:${Math.random()*10+5}px;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(el);
    const dur = Math.random()*2000+1500;
    el.animate([
      { transform:'translate(0,0) rotate(0deg)', opacity:1 },
      { transform:`translate(${(Math.random()-.5)*200}px,${innerHeight+20}px) rotate(${Math.random()*720}deg)`, opacity:0 }
    ], { duration:dur, easing:'cubic-bezier(0.25,0.46,0.45,0.94)' });
    setTimeout(() => el.remove(), dur);
  }
}
